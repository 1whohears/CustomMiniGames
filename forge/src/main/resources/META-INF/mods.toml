modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${issue_tracker}"
showAsResourcePack=false

[[mods]]
	modId="${mod_id}"
	version="${version}"
	displayName="${mod_name}"
	logoFile= "../${mod_id}.png"
    displayURL="https://modrinth.com/mod/custom-mini-games"
    updateJSONURL="https://raw.githubusercontent.com/1whohears/ModVersions/main/CustomMiniGames/update.json"
	displayTest = "MATCH_VERSION"
	authors="1whohears"
	credits="My Lizard"
	description='''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId = "onewholibs"
    mandatory = true
    versionRange = "[${onewholibs_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "architectury"
    mandatory = true
    versionRange = "[${architectury_version},)"
    ordering = "NONE"
    side = "BOTH"